name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A pull request run from this repository gets a group of its own, so it never queues behind the run it supersedes:
# GitHub takes up to a minute to stop a cancelled run, and a run in the same group waits for that (#348, record 0008).
# The `supersede` job cancels the older run instead. Other runs (fork pull requests, pushes to main, the merge queue,
# dispatch) keep one group per ref, and a fork pull request still cancels its older run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet format --verify-no-changes --no-restore
      - name: EF Core model matches migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Calendar.Infrastructure --no-build --configuration Release
      # Tests start PostgreSQL through Testcontainers; ubuntu-latest runners include Docker (ADR-0016).
      - run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format cobertura --results-directory "$GITHUB_WORKSPACE/backend/TestResults"
      - name: OpenAPI contract is up to date
        run: |
          git diff --exit-code -- ../contracts || {
            echo "::error::contracts/openapi.json is stale. Run 'just contracts' and commit the result."
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  # The web app and the API client. Format and lint cover the whole workspace, docs sources included;
  # the docs site's own checks, tests and builds run in the Docs site job beside this one (#274).
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm -r --filter '!@calendar/docs' typecheck
      - run: pnpm -r --filter '!@calendar/docs' test:coverage
      # The typecheck step above has just run the web app's `tsc -b`, so the build here is only the bundler;
      # `pnpm build` (and `just frontend build`) still type-check first.
      - name: Build the web app
        run: pnpm --filter @calendar/web exec vite build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/**/coverage
          if-no-files-found: ignore

  # The documentation site, once per URL variant: the root path (what `just docs build` produces), a
  # project subpath and, for main and docs-only PRs, the GitHub Pages URL whose build becomes the published artifact.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Listing a pull request's files, to tell a docs-only PR apart, needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Architecture model conforms to the CALM schema
        run: pnpm --filter @calendar/docs validate:architecture
      - run: pnpm --filter @calendar/docs test:coverage
      - name: Build ADR site at the root path
        run: pnpm --filter @calendar/docs build
      # `astro check` syncs the content before it reports diagnostics; the build above has just done
      # that sync, so `--noSync` reuses its generated types instead of repeating it.
      - name: Type-check with the types the build generated
        run: pnpm --filter @calendar/docs typecheck --noSync
      - name: Verify ADR site at the root path
        run: pnpm --filter @calendar/docs verify:build
      - name: Verify ADR site at a project subpath
        run: |
          pnpm --filter @calendar/docs build
          pnpm --filter @calendar/docs verify:build
        env:
          DOCS_SITE_URL: https://example.org/calendar/
      # A PR gets a preview only when every file it changes is a docs-site source (story 0030, #332).
      # Any other same-repository PR runs the checks above but builds no publication artifact, so the
      # Publish ADR site workflow has nothing to publish for it.
      - name: Decide whether this pull request is docs-only
        id: docs-only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          if [ -n "$files" ] && ! grep -qvE '^(docs|frontend/apps/docs)/' <<< "$files"; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only pull request: the publication artifact is built below."
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Not a docs-only pull request: no publication artifact and no preview."
          fi
      - name: Read GitHub Pages configuration
        id: pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.docs-only.outputs.result == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and verify publication artifact
        if: steps.pages.outcome == 'success'
        run: |
          if [ -n "$PR_NUMBER" ]; then
            export DOCS_SITE_URL="${PAGES_URL%/}/pr-preview/pr-$PR_NUMBER/"
          else
            export DOCS_SITE_URL="$PAGES_URL"
          fi
          pnpm --filter @calendar/docs build
          pnpm --filter @calendar/docs verify:build
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Upload verified publication artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: adr-site
          path: frontend/apps/docs/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: docs-coverage
          path: frontend/apps/docs/coverage
          if-no-files-found: ignore

  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No repo-root global.json: tools target the latest .NET 10 SDK (ADR-0017).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -yq shellcheck)
      - name: Read the pinned just version
        id: just-version
        run: echo "version=$(tr -d '[:space:]v' < .just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.just-version.outputs.version }}
      # `just --fmt --check` at the root does not reach module files, so each file is checked on its own (ADR-0038).
      - name: justfile and its modules parse and are formatted
        run: |
          just --list --list-submodules > /dev/null
          git ls-files -z justfile '*.just' | xargs -0 -n1 just --fmt --check --justfile
      - name: Test and lint tooling
        run: just tools test
      - name: Azure role SQL matches the local init script (PostgreSQL in Docker)
        run: just infra integration
      - name: Tooling package pins match backend
        run: just tools versions
      - name: ADRs follow conventions
        run: just tools adr

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: smoke-password
          POSTGRES_DB: calendar
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /tmp/calendar-buildx-cache
          key: image-${{ runner.os }}-${{ github.sha }}
          restore-keys: image-${{ runner.os }}-
      - name: Build image with Buildx cache
        run: |
          docker buildx create --use
          docker buildx build --load --cache-from type=local,src=/tmp/calendar-buildx-cache --cache-to type=local,dest=/tmp/calendar-buildx-cache-new,mode=max \
            --build-arg NODE_VERSION="$(cat frontend/.node-version)" -t calendar:local .
          rm -rf /tmp/calendar-buildx-cache
          mv /tmp/calendar-buildx-cache-new /tmp/calendar-buildx-cache
      - name: Read the pinned just version
        id: just-version
        run: echo "version=$(tr -d '[:space:]v' < .just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.just-version.outputs.version }}
      - name: Run image and smoke test
        env:
          ConnectionStrings__Calendar: Host=127.0.0.1;Port=5432;Database=calendar;Username=postgres;Password=smoke-password
        run: |
          docker run -d --name calendar-smoke --network host -e ConnectionStrings__Calendar calendar:local
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 1
          done
          just image smoke
      - name: Container logs
        if: ${{ failure() }}
        run: docker logs calendar-smoke

  # Cancels this pull request's older runs, which no longer share a concurrency group with this one (see `concurrency`).
  # It is the only job with actions: write; it checks nothing out and runs no code from the pull request. `CI result`
  # does not wait for it: a cancel that fails costs runner time, not correctness.
  supersede:
    name: Cancel superseded runs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs of this branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ids=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f branch="$HEAD_REF" -F per_page=30 \
            --jq '.workflow_runs[]
              | select(.status != "completed" and .id < (env.GITHUB_RUN_ID | tonumber)
                and .head_repository.full_name == env.GITHUB_REPOSITORY)
              | .id')
          [ -n "$ids" ] || { echo "No older run of this branch is still in progress."; exit 0; }
          for id in $ids; do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not cancel run $id; it may have finished meanwhile."
          done

  # Single stable check for branch protection, so adding/renaming jobs doesn't require ruleset changes.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [backend, frontend, docs, tooling, image]
    runs-on: ubuntu-latest
    # actions: read lets the step below read this run's job conclusions from the API.
    permissions:
      actions: read
    steps:
      # Passes only when every needed job succeeded: failed, cancelled, skipped or anything else fails (#368). The jobs
      # API is checked as well, because in run 42270142424 a job that failed in "Set up job" did not show as failed in
      # `needs`, and this check turned green.
      - name: All needed jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A needed job did not succeed."
            exit 1
          fi
          # Every other job of this run attempt, except this one and the optional Cancel superseded runs. Up to three tries,
          # 5 s apart, while the API errs or still shows a job as running; whatever the last try finds decides.
          for try in 1 2 3; do
            if others=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              --jq '.jobs[] | select(.name != "CI result" and .name != "Cancel superseded runs")
                | select(.conclusion != "success") | "\(.name): \(.status) \(.conclusion)"'); then
              if [ -z "$others" ] || ! grep -qv ': completed ' <<< "$others"; then break; fi
            else
              others="the jobs API could not be read"
            fi
            [ "$try" = 3 ] || sleep 5
          done
          if [ -n "$others" ]; then
            echo "::error::The jobs API reports jobs that did not succeed:"
            echo "$others"
            exit 1
          fi
          echo "All CI jobs passed."
