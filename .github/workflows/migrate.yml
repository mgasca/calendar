name: Database migration
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify PostgreSQL root certificates
        run: |
          test -f /etc/ssl/certs/DigiCert_Global_Root_G2.pem
          test -f /etc/ssl/certs/Microsoft_RSA_Root_Certificate_Authority_2017.pem
      - name: Install pinned Azure CLI
        run: |
          source tools/azure-versions.env
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades "azure-cli=${AZURE_CLI_VERSION}-1~noble"
          test "$(az version --query '"azure-cli"' -o tsv)" = "$AZURE_CLI_VERSION"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply migrations
        env:
          INFRA_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          printf '## Database migration: %s\n\n' "$INFRA_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          make infra-migrate ENV="$INFRA_ENVIRONMENT" | tee -a "$GITHUB_STEP_SUMMARY"
