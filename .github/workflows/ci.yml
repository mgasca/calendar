name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet format --verify-no-changes --no-restore
      - name: EF Core model matches migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Calendar.Infrastructure --no-build --configuration Release
      # Tests start PostgreSQL through Testcontainers; ubuntu-latest runners include Docker (ADR-0016).
      - run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format cobertura --results-directory "$GITHUB_WORKSPACE/backend/TestResults"
      - name: OpenAPI contract is up to date
        run: |
          git diff --exit-code -- ../contracts || {
            echo "::error::contracts/openapi.json is stale. Run 'make contracts' and commit the result."
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/**/coverage
          if-no-files-found: ignore

  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No repo-root global.json: tools target the latest .NET 10 SDK (ADR-0017).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -yq shellcheck)
      - name: Test and lint tooling
        run: make tooling
      - name: Tooling package pins match backend
        run: make tool-versions
      - name: ADRs follow conventions
        run: make adr-check

  # Single stable check for branch protection, so adding/renaming jobs doesn't require ruleset changes.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [backend, frontend, tooling]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI jobs passed."
