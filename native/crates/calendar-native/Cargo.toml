[package]
name = "calendar-native"
version = "0.1.0"
description = "Calendar's second UI, built with Rune, for Linux, macOS, Windows and the browser (WASM)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "calendar-native"
path = "src/main.rs"

[dependencies]
calendar-client = { path = "../calendar-client" }
chrono = "0.4"
# The IANA time-zone database, embedded: event instants are shown in the user's zone on every target.
chrono-tz = "0.10"
# The user's IANA zone, from the OS or (wasm32) the browser.
iana-time-zone = "0.1"
rune = { workspace = true }
serde = "1"
serde_json = "1"
uuid = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
form_urlencoded = "1"
keyring = "4.2"
rand = "0.10"
sha2 = "0.11"
thiserror = "2"
# One background thread runs the API calls (fetch.rs); reqwest needs tokio on the desktop.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
webbrowser = "1"

[lints]
workspace = true

[dev-dependencies]
png = "0.18"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
