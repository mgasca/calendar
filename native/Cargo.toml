# The Rune second UI (ADR-0067): its own workspace, toolchain and lock file, with no dependency on backend/.
[workspace]
resolver = "3"
members = ["crates/calendar-native"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Rune is pre-release: pin an exact rev of its `dev` branch (never rewritten). A bump moves this rev, every
# [patch.crates-io] entry below and rust-toolchain.toml together (native/AGENTS.md, "Bumping Rune").
rune = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb" }
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Cargo does not inherit a dependency's patches: Rune's "Depending on Rune" asks every app to patch each crate in
# its own [patch.crates-io] table, from the same rev as Rune itself.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "9553c9a7d7d1e5e038d14e0b313513e95b4fb8bb" }
