schema_version: "1.1"
name: slides-mode-links-deck
expected_outcome: |
  In slides mode the skill shows the deck outline, then writes
  docs/narratives/ticket-kata/slides.md as plain Slidev Markdown: a title
  slide, a section per act, the driving characteristics with targets, both
  diagrams copied in as mermaid blocks from their .mmd files, the decisions
  and the top risk. It has no theme, fonts or favicon. 00-front-matter.md
  gains `slides: slides/ticket-kata/` and the narrative is restitched.
