[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
calendar-domain = { path = "crates/calendar-domain" }
calendar-infrastructure = { path = "crates/calendar-infrastructure" }
calendar-testing = { path = "crates/calendar-testing" }
axum = "0.8.9"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
diesel = { version = "2.3.14", default-features = false }
diesel-async = "0.9.2"
diesel_migrations = "2.3.2"
form_urlencoded = "1.2.2"
futures-util = "0.3.34"
mime_guess = "2.0.5"
opentelemetry = { version = "0.33.1", default-features = false }
opentelemetry-otlp = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false }
rand = "0.10.3"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
testcontainers-modules = "0.15.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
uuid = "1.29.2"
