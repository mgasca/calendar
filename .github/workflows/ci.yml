name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A pull request run from this repository gets a group of its own, so it never queues behind the run it supersedes:
# GitHub takes up to a minute to stop a cancelled run, and a run in the same group waits for that (#348, record 0008).
# The `supersede` job cancels the older run instead. Other runs (fork pull requests, pushes to main, the merge queue,
# dispatch) keep one group per ref, and a fork pull request still cancels its older run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Decides which jobs this run needs from the files it changes (ADR-0046, story 0038). Pull requests and merge groups
  # run only the jobs whose inputs they change; pushes and dispatches run every job, and so does a run whose file list
  # may be truncated or that changes the rules (.github/ci-changes.jq, which tools/delivery-guards tests). ADR
  # conventions is the one exception: a pull request or merge group never runs it with Tooling, which runs the same
  # check. CI result accepts a skipped job only when this job's output for it is false.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Listing a pull request's files needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      docs: ${{ steps.decide.outputs.docs }}
      tooling: ${{ steps.decide.outputs.tooling }}
      adr: ${{ steps.decide.outputs.adr }}
      image: ${{ steps.decide.outputs.image }}
      skipped: ${{ steps.decide.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Decide which jobs this run needs
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          # Each changed file as [path, old path of a rename or null]. A pull request's listing is complete when it holds
          # as many files as the pull request changes; a comparison lists at most 300 files.
          case "$EVENT" in
            pull_request)
              listing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[] | [.filename, .previous_filename]')
              input=$(jq -sc --arg event "$EVENT" --argjson changed "$CHANGED_FILES" \
                '{event: $event, complete: (length == $changed), files: [.[][] | strings]}' <<< "$listing") ;;
            merge_group)
              listing=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq '.files[]? | [.filename, .previous_filename]')
              input=$(jq -sc --arg event "$EVENT" \
                '{event: $event, complete: (length < 300), files: [.[][] | strings]}' <<< "$listing") ;;
            *)
              input=$(jq -nc --arg event "$EVENT" '{event: $event, complete: true, files: []}') ;;
          esac
          result=$(jq -c -f .github/ci-changes.jq <<< "$input")
          jq -r 'to_entries[] | "\(.key)=\(.value | if type == "array" then tojson else tostring end)"' <<< "$result" >> "$GITHUB_OUTPUT"
          jq -r '"\(.files | length) changed file(s), listing complete: \(.complete)"' <<< "$input"
          jq -r 'del(.skipped) | to_entries[] | "\(.key): \(if .value then "runs" else "skipped" end)"' <<< "$result" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      CARGO_TERM_COLOR: always
      # CI builds from scratch or from the cache below, so incremental compilation only adds to the cache.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      # The toolchain pinned in backend/rust-toolchain.toml, with rustfmt and clippy. Runners ship rustup; naming the
      # channel keeps the install independent of rustup's own defaults.
      - name: Install the pinned Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --no-self-update
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          cargo --version
      # The registry and the compiled dependencies, per toolchain and lock file; an older cache of the same toolchain
      # is a starting point when the lock file changed.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: backend-${{ runner.os }}-rust-${{ steps.toolchain.outputs.channel }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: backend-${{ runner.os }}-rust-${{ steps.toolchain.outputs.channel }}-
      - run: cargo fetch --locked
      # Clippy denies every warning; the workspace lints in Cargo.toml set the levels.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check
      # Tests start PostgreSQL through Testcontainers; ubuntu-latest runners include Docker (ADR-0016).
      # cargo-llvm-cov runs `cargo test` on an instrumented build and writes a Cobertura report. The release binary is
      # pinned; llvm-tools is installed here rather than in rust-toolchain.toml so local and image builds skip it.
      - name: Install cargo-llvm-cov
        env:
          LLVM_COV_VERSION: 0.9.1
        run: |
          rustup component add llvm-tools-preview
          curl -LsSf "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xzf - -C "$HOME/.cargo/bin"
      - name: Test with coverage
        run: |
          mkdir -p TestResults
          cargo llvm-cov --workspace --locked --cobertura --output-path TestResults/backend.cobertura.xml
      - name: OpenAPI contract is up to date
        run: |
          cargo run --locked -p calendar-api -- --openapi ../contracts/openapi.json
          git diff --exit-code -- ../contracts || {
            echo "::error::contracts/openapi.json is stale. Run 'just contracts' and commit the result."
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  # The web app and the API client. Format and lint cover the whole workspace, docs sources included;
  # the docs site's own checks, tests and builds run in the Docs site job beside this one (#274).
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # The docs site and the narrative decks it builds (@calendar/slides) are checked in the Docs site job.
      - run: pnpm -r --filter '!@calendar/docs' --filter '!@calendar/slides' typecheck
      - run: pnpm -r --filter '!@calendar/docs' --filter '!@calendar/slides' test:coverage
      # The typecheck step above has just run the web app's `tsc -b`, so the build here is only the bundler;
      # `pnpm build` (and `just frontend build`) still type-check first.
      - name: Build the web app
        run: pnpm --filter @calendar/web exec vite build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/**/coverage
          if-no-files-found: ignore

  # The documentation site, once per URL variant: the root path (what `just docs build` produces), a
  # project subpath and, for main and every same-repository PR that runs this job, the GitHub Pages URL whose build
  # becomes the published artifact.
  docs:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The delivery dashboard pages are rendered from the daily snapshots on the dashboard-data branch (story 0053,
      # ADR-0049). Reading it needs only contents: read, so the ADR-0025 permission split is unchanged. No such branch is
      # fine (the pages say "no snapshot yet"); any other git failure stops the job. Keep in step with `just docs dashboard-data`.
      - name: Read the dashboard data branch
        working-directory: frontend/apps/docs
        run: |
          rm -rf .dashboard-data
          status=0
          git ls-remote --exit-code --heads origin dashboard-data > /dev/null || status=$?
          if [ "$status" -eq 2 ]; then
            echo "No dashboard-data branch: the dashboard pages say that no snapshot exists yet."
          elif [ "$status" -ne 0 ]; then
            echo "::error::Could not read the dashboard-data branch (git exit $status)."
            exit "$status"
          else
            git fetch --quiet --depth 1 origin dashboard-data
            if git cat-file -e FETCH_HEAD:snapshots 2> /dev/null; then
              mkdir -p .dashboard-data/snapshots
              git -C "$(git rev-parse --show-toplevel)" archive FETCH_HEAD:snapshots | tar -x -C .dashboard-data/snapshots
              ls .dashboard-data/snapshots
            fi
          fi
      # The Frontend job formats and lints the whole workspace, but it does not run for a change to the docs site alone
      # (story 0038), so this job checks the site's own sources whenever Frontend does not run.
      - name: Format and lint the docs site
        if: needs.changes.outputs.frontend != 'true'
        run: |
          pnpm exec prettier --check apps/docs apps/slides
          pnpm exec eslint apps/docs apps/slides --max-warnings=0
      - name: Architecture model conforms to the CALM schema
        run: pnpm --filter @calendar/docs validate:architecture
      - run: pnpm --filter @calendar/docs test:coverage
      # Deck discovery, the deck base and a real Slidev build of the fixture deck (ADR-0060). The app is plain
      # TypeScript, so `tsc` checks it; the Docs site's own typecheck is `astro check --noSync` further down.
      - name: Test and type-check the narrative decks
        run: |
          pnpm --filter @calendar/slides exec tsc --noEmit
          pnpm --filter @calendar/slides test
      - name: Build docs site at the root path
        run: pnpm --filter @calendar/docs build
      # `astro check` syncs the content before it reports diagnostics; the build above has just done
      # that sync, so `--noSync` reuses its generated types instead of repeating it.
      - name: Type-check with the types the build generated
        run: pnpm --filter @calendar/docs typecheck --noSync
      - name: Verify docs site at the root path
        run: pnpm --filter @calendar/docs verify:build
      - name: Verify docs site at a project subpath
        run: |
          pnpm --filter @calendar/docs build
          pnpm --filter @calendar/docs verify:build
        env:
          DOCS_SITE_URL: https://example.org/calendar/
      # Every same-repository PR that runs this job changes the docs, so it gets a preview (ADR-0025 amendment of
      # 2026-11-07, story 0038). A PR that changes no docs path skips this job and builds no publication artifact, so
      # the Publish docs site workflow has nothing to publish for it. A dispatch builds none either.
      - name: Read GitHub Pages configuration
        id: pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and verify publication artifact
        if: steps.pages.outcome == 'success'
        run: |
          if [ -n "$PR_NUMBER" ]; then
            export DOCS_SITE_URL="${PAGES_URL%/}/pr-preview/pr-$PR_NUMBER/"
          else
            export DOCS_SITE_URL="$PAGES_URL"
          fi
          pnpm --filter @calendar/docs build
          pnpm --filter @calendar/docs verify:build
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Upload verified publication artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: frontend/apps/docs/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: docs-coverage
          path: frontend/apps/docs/coverage
          if-no-files-found: ignore

  tooling:
    name: Tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .deno-version
          cache: true
      # The SDK pinned in the repo-root global.json, which the tool lock files match (ADR-0017, #645). The NuGet cache holds the tools'
      # #:package pins, which the first test app otherwise downloads on every run (#351, record 0011).
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            tools/**/packages.lock.json
            .claude/skills/**/packages.lock.json
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -yq shellcheck)
      - name: Read the pinned just version
        id: just-version
        run: echo "version=$(tr -d '[:space:]v' < .just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.just-version.outputs.version }}
      # `just --fmt --check` at the root does not reach module files, so each file is checked on its own (ADR-0038).
      - name: justfile and its modules parse and are formatted
        run: |
          just --list --list-submodules > /dev/null
          git ls-files -z justfile '*.just' | xargs -0 -n1 just --fmt --check --justfile
      - name: Test and lint tooling
        run: just tools test
      - name: Azure role SQL matches the local init script (PostgreSQL in Docker)
        run: just infra integration
      - name: Tooling package pins agree
        run: just tools versions
      - name: ADRs follow conventions
        run: just tools adr

  # The ADR check alone, for a change to the ADRs, the story cards or the architecture model that runs no Tooling job
  # (issue #572): `check-adr` reads all three (story 0051), and takes about a second. On a pull request or merge group,
  # Changes never runs this job and Tooling together, because Tooling's last step runs the same check. Pushes and
  # dispatches run both, so ADR-0045 can baseline and gate this job from main.
  adr:
    name: ADR conventions
    needs: changes
    if: needs.changes.outputs.adr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .deno-version
          cache: true
      # The script finds docs/decisions, docs/stories and the model from the repository root, as `just tools adr` does.
      - name: ADRs follow conventions
        run: deno run --config .claude/skills/adr-draft/deno.json --frozen --no-prompt --allow-read --allow-run=git .claude/skills/adr-draft/scripts/check-adr/check-adr.ts

  image:
    name: Container image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: smoke-password
          POSTGRES_DB: calendar
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /tmp/calendar-buildx-cache
          key: image-${{ runner.os }}-${{ github.sha }}
          restore-keys: image-${{ runner.os }}-
      - name: Build image with Buildx cache
        run: |
          docker buildx create --use
          docker buildx build --load --cache-from type=local,src=/tmp/calendar-buildx-cache --cache-to type=local,dest=/tmp/calendar-buildx-cache-new,mode=max \
            --build-arg NODE_VERSION="$(cat frontend/.node-version)" -t calendar:local .
          rm -rf /tmp/calendar-buildx-cache
          mv /tmp/calendar-buildx-cache-new /tmp/calendar-buildx-cache
      - name: Read the pinned just version
        id: just-version
        run: echo "version=$(tr -d '[:space:]v' < .just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.just-version.outputs.version }}
      - name: Run image and smoke test
        env:
          ConnectionStrings__Calendar: Host=127.0.0.1;Port=5432;Database=calendar;Username=postgres;Password=smoke-password
        run: |
          docker run -d --name calendar-smoke --network host -e ConnectionStrings__Calendar calendar:local
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 1
          done
          just image smoke
      - name: Container logs
        if: ${{ failure() }}
        run: docker logs calendar-smoke

  # Cancels this pull request's older runs, which no longer share a concurrency group with this one (see `concurrency`).
  # It is the only job with actions: write; it checks nothing out and runs no code from the pull request. `CI result`
  # does not wait for it: a cancel that fails costs runner time, not correctness.
  supersede:
    name: Cancel superseded runs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs of this branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ids=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f branch="$HEAD_REF" -F per_page=30 \
            --jq '.workflow_runs[]
              | select(.status != "completed" and .id < (env.GITHUB_RUN_ID | tonumber)
                and .head_repository.full_name == env.GITHUB_REPOSITORY)
              | .id')
          [ -n "$ids" ] || { echo "No older run of this branch is still in progress."; exit 0; }
          for id in $ids; do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Could not cancel run $id; it may have finished meanwhile."
          done

  # Single stable check for branch protection, so adding/renaming jobs doesn't require ruleset changes.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, backend, frontend, docs, tooling, adr, image]
    runs-on: ubuntu-latest
    # actions: read lets the steps below read this run's jobs from the API; contents: read checks out .github/ only,
    # for the run-time gate and its baseline from the commit under test.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          persist-credentials: false
      # Passes only when every needed job succeeded: failed, cancelled or anything else fails (#368). The one exception
      # is a job skipped because Changes said this run does not need it (ADR-0046): its output for that job is "false".
      # Changes has no output for itself, so it must succeed, and when it fails every job after it is skipped with no
      # "false" output either. The jobs API is checked as well, because in run 42270142424 a job that failed in "Set up
      # job" did not show as failed in `needs`, and this check turned green.
      - name: All needed jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SKIPPED: ${{ needs.changes.outputs.skipped || '[]' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e '. as $needs | length > 0 and all(to_entries[]; .value.result == "success"
            or (.value.result == "skipped" and $needs.changes.outputs[.key] == "false"))' <<< "$NEEDS" > /dev/null; then
            echo "::error::A needed job did not succeed, and Changes did not skip it."
            exit 1
          fi
          # Every other job of this run attempt, except this one and the optional Cancel superseded runs, that did not
          # succeed and was not skipped by Changes. Up to three tries, 5 s apart, while the API errs or still shows a job
          # as running; whatever the last try finds decides. The last response is kept in $RUNNER_TEMP/jobs.json for the
          # run-time gate below.
          # shellcheck disable=SC2016 # $skipped is a jq variable, so the single quotes are intended.
          for try in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              > "$RUNNER_TEMP/jobs.json"; then
              others=$(jq -r '(env.SKIPPED | fromjson) as $skipped | .jobs[] | select(.name != "CI result" and .name != "Cancel superseded runs")
                | select(.conclusion != "success")
                | select(.conclusion != "skipped" or (.name | IN($skipped[]) | not))
                | "\(.name): \(.status) \(.conclusion)"' "$RUNNER_TEMP/jobs.json")
              if [ -z "$others" ] || ! grep -qv ': completed ' <<< "$others"; then break; fi
            else
              others="the jobs API could not be read"
            fi
            [ "$try" = 3 ] || sleep 5
          done
          if [ -n "$others" ]; then
            echo "::error::The jobs API reports jobs that did not succeed:"
            echo "$others"
            exit 1
          fi
          echo "All CI jobs passed."
      # ADR 0045: fails a pull request or merge-queue run when a job took longer than its pinned threshold in
      # .github/ci-baseline.json, and only reports on pushes, dispatches and provisional baselines. All of the logic is in
      # .github/ci-gate.jq, which tools/ci-timings/tests/GateTests.cs runs; this step only feeds it the saved response.
      - name: Job run times are within the baseline (ADR 0045)
        run: |
          gate=(jq -r -f .github/ci-gate.jq --slurpfile baseline .github/ci-baseline.json --arg event "$GITHUB_EVENT_NAME")
          "${gate[@]}" --arg format summary "$RUNNER_TEMP/jobs.json" >> "$GITHUB_STEP_SUMMARY"
          "${gate[@]}" "$RUNNER_TEMP/jobs.json"
