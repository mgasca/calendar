name: Database migration
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
permissions:
  contents: read
concurrency:
  group: migrate-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The infra tool builds backend/crates/calendar-migrate and runs it, so the job needs the toolchain pinned in
      # backend/rust-toolchain.toml (runners ship rustup) as well as the .NET SDK the tool itself runs on.
      - name: Install the pinned Rust toolchain
        working-directory: backend
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          cargo --version
      - name: Read the pinned just version
        id: just-version
        run: echo "version=$(tr -d '[:space:]v' < .just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.just-version.outputs.version }}
      - name: Verify PostgreSQL root certificates
        run: |
          test -f /etc/ssl/certs/DigiCert_Global_Root_G2.pem
          test -f /etc/ssl/certs/Microsoft_RSA_Root_Certificate_Authority_2017.pem
      - name: Install pinned Azure CLI
        uses: ./.github/actions/install-azure-cli
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Apply migrations
        env:
          INFRA_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          printf '## Database migration: %s\n\n' "$INFRA_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          just infra migrate "$INFRA_ENVIRONMENT" | while IFS= read -r line || [[ -n "$line" ]]; do
            printf '%s\n' "$line"
            if [[ "$line" != ::* ]]; then
              printf '%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
