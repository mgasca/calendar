name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The repo tools (tools/, .claude/skills/) are .NET file-based apps with no project to build (ADR-0017).
          - language: csharp
            build-mode: none
          # The backend (backend/crates).
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      # The Rust extractor loads the backend workspace with cargo: it fetches about 330 crates and builds their build
      # scripts and proc macros, 25-36 s of its LoadManifest phase on a cold runner (issue #883, record 0027). The rust
      # analysis restores the registry and a persistent target directory for the extractor, which cut that phase to
      # about 1 s. A run that is not a pull request saves both once per lock file, so pull requests read main's copies.
      # The target directory is also keyed on the runner's rustc, the toolchain the extractor uses.
      - name: Read the extractor's Rust toolchain
        id: rustc
        if: matrix.language == 'rust'
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo registry
        id: registry
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: codeql-rust-registry-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: codeql-rust-registry-${{ runner.os }}-
      - name: Restore the extractor's target directory
        id: target
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/codeql-rust-target
          key: >-
            codeql-rust-target-${{ runner.os }}-rustc-${{ steps.rustc.outputs.version }}-${{
            hashFiles('backend/Cargo.lock') }}
          restore-keys: codeql-rust-target-${{ runner.os }}-rustc-${{ steps.rustc.outputs.version }}-
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-rust-target
        with:
          category: /language:${{ matrix.language }}
      - name: Report the extractor's cargo state
        if: always() && matrix.language == 'rust'
        env:
          TARGET: ${{ runner.temp }}/codeql-rust-target
        run: |
          echo "crates in the registry cache: $(find ~/.cargo/registry/cache -name '*.crate' 2>/dev/null | wc -l)"
          echo "build-script output dirs: $(find "$TARGET" -maxdepth 3 -type d -path '*/build/*' 2>/dev/null | wc -l)"
          echo "target directory: $(du -sh "$TARGET" 2>/dev/null | cut -f1)"
      - name: Save the cargo registry
        if: >-
          matrix.language == 'rust' && github.event_name != 'pull_request' && steps.registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.registry.outputs.cache-primary-key }}
      - name: Save the extractor's target directory
        if: matrix.language == 'rust' && github.event_name != 'pull_request' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/codeql-rust-target
          key: ${{ steps.target.outputs.cache-primary-key }}
