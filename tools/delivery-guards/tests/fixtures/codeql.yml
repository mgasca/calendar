name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes no input of a Rust workspace skips that workspace's analysis and reuses main's result
  # for the same inputs (issue #882, ADR-0046 amendment of 2026-11-15). The backend's input set is CI's Backend set and
  # the native UI's is CI's Native set (#1019): this job runs the same rules as CI's Changes job, then
  # .github/codeql-languages.jq. A push, the schedule and a dispatch analyse every language.
  languages:
    name: CodeQL languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Listing a pull request's files needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      native: ${{ steps.decide.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Decide which languages this run analyses
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # The same input as CI's Changes job: each changed file and the old path of a rename, and whether the listing
          # holds as many files as the pull request changes.
          if [ "$EVENT" = pull_request ]; then
            listing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | [.filename, .previous_filename]')
            input=$(jq -sc --arg event "$EVENT" --argjson changed "$CHANGED_FILES" \
              '{event: $event, complete: (length == $changed), files: [.[][] | strings]}' <<< "$listing")
          else
            input=$(jq -nc --arg event "$EVENT" '{event: $event, complete: true, files: []}')
          fi
          changes=$(jq -c -f .github/ci-changes.jq <<< "$input")
          result=$(jq -c -f .github/codeql-languages.jq --argjson changes "$changes" <<< "$input")
          jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$result" >> "$GITHUB_OUTPUT"
          jq -r '"\(.files | length) changed file(s), listing complete: \(.complete)"' <<< "$input"
          jq -r 'to_entries[]
            | "\(.key): \(if .value then "analysed" else "no input changed, so a matching main result is reused" end)"' \
            <<< "$result" | tee -a "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze (${{ matrix.analysis }})
    needs: languages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # `analysis` names the job and the category (/language:<analysis>). A Rust entry analyses one Cargo workspace,
      # `root`, through a `paths` config, so the extractor never loads the other workspace's manifests (a source root
      # does not stop it: #1020, run 44727071875), and `gate` is its output of the languages job (#1019).
      matrix:
        include:
          # The backend (backend/crates).
          - { language: rust, analysis: rust, root: backend, gate: rust, config: '{"paths":["backend"]}' }
          # The Rune UI (native/, ADR-0067), with its own category and caches, so Rune's git dependencies never reach
          # the backend's analysis.
          - { language: rust, analysis: rust-native, root: native, gate: native, config: '{"paths":["native"]}' }
          # The frontend, and the repo tools and scripted skills in TypeScript on Deno (tools/, .claude/skills/, ADR-0058).
          - { language: javascript-typescript, analysis: javascript-typescript }
          - { language: actions, analysis: actions }
    steps:
      - uses: actions/checkout@v7
      # The main ruleset's code_scanning rule blocks a pull request whose head lacks an analysis in a category main has
      # (record 0026), so a pull request that changes no input of a Rust entry uploads the result of the newest analysed
      # main commit whose inputs for that entry match its head. The match is decided by the gate's rules, on the files
      # between that commit and the head. With no match among main's 10 latest analyses in the category, the full
      # analysis below runs.
      - name: Find main's Rust result for these Rust inputs
        id: reuse
        if: matrix.language == 'rust' && needs.languages.outputs[matrix.gate] == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ matrix.gate }}
          CATEGORY: /language:${{ matrix.analysis }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          merge_base=$(gh api "$repo/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          candidates=$(gh api "$repo/code-scanning/analyses?ref=refs/heads/main&tool_name=CodeQL&per_page=100" \
            | jq -r --arg category "$CATEGORY" '
            [.[] | select(.category == $category and .analysis_key == ".github/workflows/codeql.yml:analyze"
              and .error == "")][:10][] | "\(.id) \(.commit_sha)"')
          while read -r id sha; do
            [ -n "$id" ] || continue
            # The analysed commit must be the merge base or one of its ancestors ...
            status=$(gh api "$repo/compare/$sha...$merge_base" --jq .status)
            [ "$status" = identical ] || [ "$status" = ahead ] || continue
            # ... and the files between it and the head must change no input of this entry, by the gate's own rules.
            input=$(gh api "$repo/compare/$sha...$HEAD_SHA" --jq '{event: "pull_request",
              complete: ((.files // []) | length < 300),
              files: [(.files // [])[] | .filename, (.previous_filename // empty)]}')
            changes=$(jq -c -f .github/ci-changes.jq <<< "$input")
            analyse=$(jq -c -f .github/codeql-languages.jq --argjson changes "$changes" <<< "$input" \
              | jq -r --arg gate "$GATE" '.[$gate]')
            if [ "$analyse" = false ]; then
              gh api -H "Accept: application/sarif+json" "$repo/code-scanning/analyses/$id" \
                | jq 'del(.runs[].automationDetails)' > "$RUNNER_TEMP/reused.sarif"
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "$CATEGORY: reuses main's analysis $id of $sha; no input changed between it and $HEAD_SHA." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <<< "$candidates"
          echo "$CATEGORY: no analysed main commit has these inputs; running the full analysis." \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload main's Rust result for this pull request
        if: steps.reuse.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/reused.sarif
          category: /language:${{ matrix.analysis }}
      # The Rust extractor loads the entry's workspace with cargo: for the backend it fetches about 330 crates and builds
      # their build scripts and proc macros, 25-36 s of its LoadManifest phase on a cold runner (issue #883, record
      # 0027). A Rust analysis restores the registry and a persistent target directory for the extractor, which cut that
      # phase to about 1 s. A run that is not a pull request saves both once per lock file, so pull requests read main's
      # copies. Each Rust entry has its own entries, keyed on its own lock file (#1019).
      # The target directory is also keyed on the runner's default rustc: the analyze step sets RUSTUP_TOOLCHAIN=stable,
      # so the extractor keeps "project Rust toolchain: stable (default)" in every workspace, instead of rustup installing
      # the workspace's rust-toolchain.toml pin (native/'s is Rune's 1.99.1) when cargo runs there.
      - name: Read the extractor's Rust toolchain
        id: rustc
        if: matrix.language == 'rust' && steps.reuse.outputs.found != 'true'
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo registry
        id: registry
        if: matrix.language == 'rust' && steps.reuse.outputs.found != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: codeql-${{ matrix.analysis }}-registry-${{ runner.os }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.root)) }}
          # Only a pull request falls back to an older lock file's entry. A run that saves restores the exact key or
          # nothing, so a saved entry never carries crates or builds the lock file no longer uses.
          restore-keys: >-
            ${{ github.event_name == 'pull_request' && format('codeql-{0}-registry-{1}-', matrix.analysis, runner.os) || '' }}
      - name: Restore the extractor's target directory
        id: target
        if: matrix.language == 'rust' && steps.reuse.outputs.found != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/codeql-${{ matrix.analysis }}-target
          key: >-
            codeql-${{ matrix.analysis }}-target-${{ runner.os }}-rustc-${{ steps.rustc.outputs.version }}-${{
            hashFiles(format('{0}/Cargo.lock', matrix.root)) }}
          restore-keys: >-
            ${{ github.event_name == 'pull_request'
            && format('codeql-{0}-target-{1}-rustc-{2}-', matrix.analysis, runner.os, steps.rustc.outputs.version) || '' }}
      # Rune's build scripts find libxkbcommon and libwayland-client with pkg-config, as in CI's Native job; without them
      # the extractor loads the native workspace with failed build scripts.
      - name: Install the native UI's build libraries
        if: matrix.root == 'native' && steps.reuse.outputs.found != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxkbcommon-dev libwayland-dev
      - uses: github/codeql-action/init@v4
        if: steps.reuse.outputs.found != 'true'
        with:
          languages: ${{ matrix.language }}
          # A Rust entry's workspace only (#1002, #1019); empty for the other entries, which analyse the whole checkout.
          config: ${{ matrix.config || '' }}
          # No language here needs a build (ADR-0051, ADR-0058).
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        if: steps.reuse.outputs.found != 'true'
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-${{ matrix.analysis }}-target
          RUSTUP_TOOLCHAIN: stable
        with:
          category: /language:${{ matrix.analysis }}
      - name: Report the extractor's cargo state
        if: always() && matrix.language == 'rust' && steps.reuse.outputs.found != 'true'
        env:
          TARGET: ${{ runner.temp }}/codeql-${{ matrix.analysis }}-target
        run: |
          echo "crates in the registry cache: $(find ~/.cargo/registry/cache -name '*.crate' 2>/dev/null | wc -l)"
          echo "git checkouts: $(find ~/.cargo/git/db -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)"
          echo "build-script output dirs: $(find "$TARGET" -maxdepth 3 -type d -path '*/build/*' 2>/dev/null | wc -l)"
          echo "target directory: $(du -sh "$TARGET" 2>/dev/null | cut -f1)"
      - name: Save the cargo registry
        if: >-
          matrix.language == 'rust' && github.event_name != 'pull_request' && steps.registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.registry.outputs.cache-primary-key }}
      - name: Save the extractor's target directory
        if: matrix.language == 'rust' && github.event_name != 'pull_request' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/codeql-${{ matrix.analysis }}-target
          key: ${{ steps.target.outputs.cache-primary-key }}
