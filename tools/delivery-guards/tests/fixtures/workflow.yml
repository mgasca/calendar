name: CI
on:
  pull_request:
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changes
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      docs: ${{ steps.decide.outputs.docs }}
      tooling: ${{ steps.decide.outputs.tooling }}
      native: ${{ steps.decide.outputs.native }}
      image: ${{ steps.decide.outputs.image }}
      skipped: ${{ steps.decide.outputs.skipped }}
    steps:
      - id: decide
        run: result=$(jq -c -f .github/ci-changes.jq <<< "$input")
  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --workspace --all-targets --locked
      - run: cargo fmt --all --check
  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!@calendar/docs' typecheck
      - run: pnpm -r --filter '!@calendar/docs' test:coverage
      - name: Build the web app
        run: pnpm --filter @calendar/web exec vite build
  docs:
    name: Docs site
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - run: pnpm --filter @calendar/docs build
      - run: pnpm --filter @calendar/docs typecheck --noSync
  tooling:
    name: Tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    steps:
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version
          cache: true
      - name: Test and lint tooling
        run: just tools test
  image:
    name: Container image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Restore the Buildx cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/calendar-buildx-cache
          key: image-${{ runner.os }}-${{ github.sha }}
          restore-keys: image-${{ runner.os }}-
      - name: Build image with Buildx cache
        env:
          EXPORT: ${{ github.event_name != 'pull_request' }}
        run: |
          export_to=()
          if [ "$EXPORT" = true ]; then export_to=(--cache-to type=local,dest=/tmp/calendar-buildx-cache-new,mode=max); fi
          docker buildx build --load --cache-from type=local,src=/tmp/calendar-buildx-cache ${export_to[@]+"${export_to[@]}"} -t calendar:local .
      - run: just image smoke
      - name: Save the Buildx cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: /tmp/calendar-buildx-cache
          key: image-${{ runner.os }}-${{ github.sha }}
  native:
    name: Native
    needs: changes
    if: needs.changes.outputs.native == 'true'
    steps:
      - name: Restore the dependency cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            native/target
          key: native-x
      - name: Lint and test the desktop app
        if: matrix.kind == 'desktop'
        run: just native run lint-desktop test
      - name: Lint for wasm32 and build the browser bundle
        if: matrix.kind == 'wasm'
        run: just native run lint-wasm build-web
      - name: Keep only the dependencies in the cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rm -rf target/goldens target/web
          names=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[].name')
      - name: Save the dependency cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            native/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
  supersede:
    name: Cancel superseded runs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write
    steps:
      - run: |
          for id in $ids; do
            gh run cancel "$id"
          done
  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, backend, frontend, docs, tooling, image, native]
    steps:
      - run: |
          jq -e '. as $needs | all(to_entries[]; .value.result == "success"
            or (.value.result == "skipped" and $needs.changes.outputs[.key] == "false"))' <<< "$NEEDS"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.conclusion != "success")
            | select(.conclusion != "skipped" or (.name | IN($skipped[]) | not))'
