<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Calendar</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  #status { font: 16px system-ui, sans-serif; padding: 24px; }
</style>
<div id="status" role="status">Loading…</div>
<script type="module">
  // The Rune web target needs WebGPU (ADR-0067). Without it, point to the web app on the same origin. A browser can
  // expose navigator.gpu and still have no adapter, so ask for one, and load the bundle only when it can run. The
  // bundle's URL is absolute because a path under /native/ falls back to this page (#1009).
  const status = document.querySelector('#status');
  try {
    const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
    if (!adapter) {
      status.innerHTML = 'This version of Calendar needs a browser with WebGPU. <a href="/">Open the web app instead</a>.';
    } else {
      const { default: init } = await import('/native/app.js');
      await init();
      status.remove();
    }
  } catch (error) {
    status.textContent = String(error);
    console.error(error);
  }
</script>
</html>
