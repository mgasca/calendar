name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The repo tools (tools/, .claude/skills/) are .NET file-based apps with no project to build (ADR-0017).
          - language: csharp
            build-mode: none
          # The backend (backend/crates).
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      # The Rust extractor resolves the backend workspace with cargo, which downloads about 400 crates on a cold
      # runner (issue #883, record 0027). A run that is not a pull request saves the registry for its lock file, so pull
      # requests read the copy that main saved; every run restores the nearest one.
      - name: Restore the cargo registry
        id: registry
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: codeql-rust-registry-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: codeql-rust-registry-${{ runner.os }}-
      - name: Count the restored crates
        if: matrix.language == 'rust'
        run: find ~/.cargo/registry/cache -name '*.crate' 2>/dev/null | wc -l | xargs echo "crates in the registry cache:"
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
      - name: Save the cargo registry
        if: matrix.language == 'rust' && github.event_name != 'pull_request' && steps.registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.registry.outputs.cache-primary-key }}
