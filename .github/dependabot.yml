version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  # dotnet-ef lives in the repo-root .config/dotnet-tools.json, outside /backend.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]

  # Dockerfile base images and the postgres image pinned in compose.yaml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    ignore:
      # Stay on PostgreSQL 18 (ADR-0014); a major upgrade is a deliberate decision.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  # Repo tooling (.claude/skills/*, tools/) is not listed: Dependabot doesn't read .NET file-based
  # app #:package directives or folder-local Directory.Build.props, so those are bumped manually (ADR-0017).

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
