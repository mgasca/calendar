name: Publish ADR site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Cleanup uses trusted default-branch workflow code, never a PR checkout.
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

# Queue distinct PR/main updates rather than replacing a pending publication.
concurrency:
  group: github-pages
  cancel-in-progress: false
  queue: max

# Assembling and deploying are separate jobs, so "Re-run failed jobs" after a Pages error re-runs
# only the deploy, against the one artifact already uploaded (#265). Neither job holds both
# repository write access and the Pages/OIDC token (ADR-0025).
jobs:
  assemble:
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      mode: ${{ steps.source.outputs.mode }}
      pr: ${{ steps.source.outputs.pr }}
      sha: ${{ steps.source.outputs.sha }}
      ready: ${{ steps.snapshot.outputs.ready }}
      snapshot: ${{ steps.snapshot.outputs.snapshot }}
      artifact: ${{ steps.snapshot.outputs.artifact }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Validate source run and current revision
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            if (context.eventName === 'pull_request_target') {
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: context.payload.number });
              if (pr.state !== 'closed') return;
              core.setOutput('mode', 'remove');
              core.setOutput('pr', pr.number);
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: context.payload.workflow_run.id });
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...repo, workflow_id: 'ci.yml' });
            if (run.workflow_id !== workflow.id || run.repository.full_name !== fullName || run.conclusion !== 'success') return;
            if (run.event === 'push' && run.head_branch === 'main') {
              const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
              if (branch.commit.sha !== run.head_sha) return;
              core.setOutput('mode', 'production');
            } else if (run.event === 'pull_request' && run.head_repository?.full_name === fullName && run.pull_requests.length === 1) {
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: run.pull_requests[0].number });
              if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.repo?.full_name !== fullName || pr.head.sha !== run.head_sha) return;
              // CI builds the publication artifact only for a docs-only PR (story 0030); a run without one publishes nothing.
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id: run.id, name: 'adr-site' });
              if (!artifacts.artifacts.some((artifact) => artifact.name === 'adr-site' && !artifact.expired)) {
                core.notice(`CI run ${run.id} uploaded no adr-site artifact: PR ${pr.number} is not docs-only, so it gets no preview.`);
                return;
              }
              core.setOutput('mode', 'preview');
              core.setOutput('pr', pr.number);
            } else return;
            core.setOutput('run', run.id);
            core.setOutput('sha', run.head_sha);
      - name: Download exact successful run artifact
        if: steps.source.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: adr-site
          path: incoming
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run }}
      - name: Check out trusted snapshot workspace
        if: steps.source.outputs.mode != ''
        uses: actions/checkout@v7
        with:
          ref: main
          path: snapshot
      - name: Assemble retained production and preview snapshot
        if: steps.source.outputs.mode != ''
        id: snapshot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MODE: ${{ steps.source.outputs.mode }}
          PR_NUMBER: ${{ steps.source.outputs.pr }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const root = path.resolve('snapshot');
            const incoming = path.resolve('incoming');
            const git = (...args) => execFileSync('git', args, { cwd: root, encoding: 'utf8' });
            const mode = process.env.MODE;
            const number = process.env.PR_NUMBER;
            if (!['production', 'preview', 'remove'].includes(mode)) throw new Error('Invalid publication mode');
            if (mode !== 'production' && !/^[1-9]\d*$/.test(number)) throw new Error('Invalid PR number');
            // A branch may advance while the artifact is downloading.
            if (mode === 'production') {
              const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
              if (branch.commit.sha !== process.env.SOURCE_SHA) return;
            } else if (mode === 'preview') {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(number) });
              if (pr.state !== 'open' || pr.head.sha !== process.env.SOURCE_SHA) return;
            }
            // Never execute downloaded content. Reject links, special files, hidden
            // paths and reserved snapshot paths before copying any artifact bytes.
            let bytes = 0;
            function validate(directory) {
              for (const name of fs.readdirSync(directory)) {
                if (name.startsWith('.') || name === 'pr-preview') throw new Error(`Reserved artifact path: ${name}`);
                const file = path.join(directory, name);
                const stat = fs.lstatSync(file);
                if (stat.isSymbolicLink() || (!stat.isFile() && !stat.isDirectory())) throw new Error('Artifact contains a non-regular entry');
                if (stat.isDirectory()) validate(file);
                else bytes += stat.size;
              }
            }
            if (mode !== 'remove') {
              validate(incoming);
              if (bytes > 100 * 1024 * 1024 || !fs.statSync(path.join(incoming, 'index.html')).isFile()) throw new Error('Invalid site artifact');
            }
            const exists = git('ls-remote', '--heads', 'origin', 'gh-pages').trim() !== '';
            if (exists) {
              git('fetch', '--depth=1', 'origin', 'gh-pages');
              git('checkout', '-B', 'gh-pages', 'FETCH_HEAD');
            } else {
              if (mode !== 'production') {
                core.notice('Production must bootstrap the snapshot first. Rerun PR CI after the first main deployment.');
                return;
              }
              git('checkout', '--orphan', 'gh-pages');
              git('rm', '-rf', '.');
            }
            const previewRoot = path.join(root, 'pr-preview');
            if (mode === 'production') {
              for (const name of fs.readdirSync(root)) {
                if (name !== '.git' && name !== 'pr-preview') fs.rmSync(path.join(root, name), { recursive: true, force: true });
              }
              fs.cpSync(incoming, root, { recursive: true });
            } else {
              const target = path.join(previewRoot, `pr-${number}`);
              fs.rmSync(target, { recursive: true, force: true });
              if (mode === 'preview') fs.cpSync(incoming, target, { recursive: true });
            }
            // Reconcile closed PRs too, so any delayed cleanup is self-healing.
            if (fs.existsSync(previewRoot)) {
              for (const name of fs.readdirSync(previewRoot)) {
                const match = /^pr-([1-9]\d*)$/.exec(name);
                if (!match) throw new Error('Unexpected snapshot preview directory');
                const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(match[1]) });
                if (pr.state !== 'open') fs.rmSync(path.join(previewRoot, name), { recursive: true, force: true });
              }
            }
            fs.writeFileSync(path.join(root, '.nojekyll'), '');
            git('config', 'user.name', 'github-actions[bot]');
            git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
            git('add', '--all');
            if (git('status', '--porcelain').trim()) {
              git('commit', '-m', `Publish ADR ${mode} ${number || process.env.SOURCE_SHA}`);
              git('push', 'origin', 'HEAD:gh-pages');
            }
            // Keep checkout credentials and Git history out of the public artifact.
            fs.cpSync(root, path.resolve('published'), { recursive: true, filter: source => path.basename(source) !== '.git' });
            // The deploy job checks that gh-pages still points at this commit before deploying it.
            core.setOutput('snapshot', git('rev-parse', 'HEAD').trim());
            // One name per attempt: re-running every job uploads a second artifact, and a shared
            // name would leave two artifacts with one name in the run. Deploy uses the ID.
            core.setOutput('artifact', `github-pages-${process.env.GITHUB_RUN_ATTEMPT}`);
            core.setOutput('ready', 'true');
      - name: Upload combined site
        if: steps.snapshot.outputs.ready == 'true'
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: published
          name: ${{ steps.snapshot.outputs.artifact }}

  deploy:
    needs: assemble
    if: needs.assemble.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Up to 10 minutes of retries while Pages reports an in-progress deployment, then up to
    # 10 minutes for the deployment itself.
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
      checks: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Skip a snapshot a later publication replaced
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SNAPSHOT: ${{ needs.assemble.outputs.snapshot }}
        with:
          script: |
            // The artifact is the whole site. A re-run started after a newer publication must not
            // roll production or another PR's preview back, so deploy only the current gh-pages.
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'gh-pages' });
            if (branch.commit.sha !== process.env.SNAPSHOT) {
              core.notice(`gh-pages moved from ${process.env.SNAPSHOT} to ${branch.commit.sha}; a later publication deploys it.`);
              return;
            }
            core.setOutput('deploy', 'true');
            // Pages names a deployment by its build version. GITHUB_SHA is main's head for every
            // workflow_run and pull_request_target publication between two merges (#285), so give
            // each run and attempt its own version, and re-running only this job a fresh one.
            const { createHash } = require('node:crypto');
            const version = createHash('sha1')
              .update(`${process.env.SNAPSHOT}:${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}`)
              .digest('hex');
            core.setOutput('version', version);
      # Calls the Pages deployment API itself instead of actions/deploy-pages, which always sends
      # GITHUB_SHA as the build version: the runner ignores a step `env` that sets a GITHUB_*
      # variable, so the #339 override never reached the API (#429).
      - name: Deploy production and previews
        if: steps.current.outputs.deploy == 'true'
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ needs.assemble.outputs.artifact_id }}
          BUILD_VERSION: ${{ steps.current.outputs.version }}
        with:
          script: |
            const version = process.env.BUILD_VERSION;
            const artifactId = Number(process.env.ARTIFACT_ID);
            if (!/^[a-f0-9]{40}$/.test(version) || !Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Invalid build version or artifact ID');
            }
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const started = Date.now();
            const minutes = (n) => n * 60 * 1000;
            // A refusal naming an in-progress deployment is retried for up to 10 minutes, with a
            // warning, so a recurrence shows in the run without failing the publication. One lock
            // measured in #429 cleared after 7.5 to 9.5 minutes; #285 saw one last about 30.
            let deployment;
            for (let retry = 0; ; retry++) {
              try {
                ({ data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                  ...context.repo,
                  artifact_id: artifactId,
                  pages_build_version: version,
                  oidc_token: await core.getIDToken(),
                }));
                break;
              } catch (error) {
                if (error.status !== 400 || !/in progress deployment/i.test(error.message) || Date.now() - started >= minutes(10)) throw error;
                core.warning(`Pages refused build ${version} (retry ${retry + 1}): ${error.message}`);
                await sleep(30 * 1000);
              }
            }
            const created = Date.now();
            const id = deployment.id ?? version;
            core.setOutput('page_url', deployment.page_url);
            core.info(`Created Pages deployment ${id} for build ${version}.`);
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'];
            let errors = 0;
            while (true) {
              await sleep(5 * 1000);
              let status;
              try {
                ({ data: { status } } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { ...context.repo, id }));
                errors = 0;
              } catch (error) {
                if (++errors >= 10) throw error;
                core.warning(`Reading Pages deployment ${id} failed: ${error.message}`);
                continue;
              }
              if (status === 'succeed') break;
              if (failed.includes(status)) throw new Error(`Pages deployment ${id} ended with ${status}`);
              core.info(`Pages deployment ${id}: ${status}`);
              if (Date.now() - created >= minutes(10)) {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { ...context.repo, id });
                throw new Error(`Pages deployment ${id} timed out and was cancelled`);
              }
            }
            core.info(`Pages deployment ${id} succeeded.`);
      - name: Link published preview
        if: needs.assemble.outputs.mode == 'preview' && steps.deployment.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          PR_NUMBER: ${{ needs.assemble.outputs.pr }}
          SOURCE_SHA: ${{ needs.assemble.outputs.sha }}
        with:
          script: |
            const url = `${process.env.SITE_URL.replace(/\/$/, '')}/pr-preview/pr-${process.env.PR_NUMBER}/`;
            await github.rest.checks.create({
              ...context.repo, name: 'ADR preview', head_sha: process.env.SOURCE_SHA,
              status: 'completed', conclusion: 'success', details_url: url,
              output: { title: 'ADR preview ready', summary: `[Open preview](${url})` },
            });
            await core.summary.addLink(`ADR preview for PR ${process.env.PR_NUMBER}`, url).write();
            // One sticky comment per PR, found by its marker and updated on every new preview.
            const marker = '<!-- adr-preview -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const body = `${marker}\n**ADR preview** for ${process.env.SOURCE_SHA.slice(0, 7)} is ready: ${url}\n\n` +
              'The preview is replaced on each successful CI run of this PR and removed when the PR closes.';
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number, body });
