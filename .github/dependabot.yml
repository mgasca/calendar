version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  # Repo tooling (ADR-0017): versions live in folder-local Directory.Build.props and #:package
  # directives. Whether Dependabot reads these is being verified; until then they are bumped manually.
  - package-ecosystem: nuget
    directories: [/.claude/skills/adr-draft, /tools]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, tooling]
    groups:
      tooling:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
