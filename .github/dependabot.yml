version: 2
updates:
  # The backend's Cargo workspace (backend/Cargo.toml, the crate manifests and Cargo.lock). Compatible updates
  # arrive as one pull request; a new major (or a new 0.x minor, which Cargo treats as breaking) gets its own.
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # The Rust toolchain pinned in backend/rust-toolchain.toml, which CI, the image build and `just doctor` read.
  - package-ecosystem: rust-toolchain
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]

  # Dockerfile base images and the images pinned in compose.yaml (postgres, grafana/otel-lgtm, the stub OIDC
  # provider). The rust image and
  # backend/rust-toolchain.toml are bumped separately: while they differ, the image build downloads the pinned
  # toolchain, so merge the two bumps together to keep the build fast.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    ignore:
      # Stay on PostgreSQL 18 (ADR-0014); a major upgrade is a deliberate decision.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  # Repo tooling (tools/ and the scripted skills in .claude/skills/) is not listed: each Deno configuration pins
  # exact versions with its own deno.lock, bumped by hand (ADR-0058); `just tools versions` keeps the pins of one
  # package equal across the configurations.

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
