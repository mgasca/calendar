version: 2
updates:
  # The backend's Cargo workspace (backend/Cargo.toml, the crate manifests and Cargo.lock). Compatible updates
  # arrive as one pull request; a new major (or a new 0.x minor, which Cargo treats as breaking) gets its own.
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # The Rust toolchain pinned in backend/rust-toolchain.toml, which CI, the image build and `just doctor` read.
  - package-ecosystem: rust-toolchain
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]

  # The exact .NET SDK the repo tools run on, pinned in the repo-root global.json. The tool lock files record
  # the SDK's implicit AOT packages, so the bump fails CI's locked restore until they are refreshed on its
  # branch (tools/README.md, ADR-0017, #645).
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    ignore:
      # The SDK major moves with the rest of .NET in story 0056 (ADR-0050).
      - dependency-name: dotnet-sdk
        update-types: [version-update:semver-major]

  # Dockerfile base images and the images pinned in compose.yaml (postgres, grafana/otel-lgtm, the stub OIDC
  # provider). The rust image and
  # backend/rust-toolchain.toml are bumped separately: while they differ, the image build downloads the pinned
  # toolchain, so merge the two bumps together to keep the build fast.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    ignore:
      # Stay on PostgreSQL 18 (ADR-0014); a major upgrade is a deliberate decision.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  # Repo tooling (.claude/skills/*, tools/) is not listed: Dependabot doesn't read .NET file-based
  # app #:package directives or folder-local Directory.Build.props, so those are bumped manually (ADR-0017);
  # `just tools versions` keeps the pins of one package equal across the tools.

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
