version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]

  # Repo tooling (.claude/skills/*, tools/) is not listed: Dependabot doesn't read .NET file-based
  # app #:package directives or folder-local Directory.Build.props, so those are bumped manually (ADR-0017).

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
