version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, backend]
    groups:
      dotnet-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Stay on .NET 10 until story 0056 moves the SDK, target framework, images and packages together
      # (ADR-0050): a lone 11.x package fails restore or the build.
      - dependency-name: Microsoft.AspNetCore.*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.EntityFrameworkCore*
        update-types: [version-update:semver-major]
      - dependency-name: Microsoft.Extensions.ApiDescription.Server
        update-types: [version-update:semver-major]
      - dependency-name: Npgsql*
        update-types: [version-update:semver-major]
      - dependency-name: EFCore.NamingConventions
        update-types: [version-update:semver-major]

  # dotnet-ef lives in the repo-root .config/dotnet-tools.json, outside /backend.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]

  # The exact .NET SDK the repo tools run on, pinned in the repo-root global.json. The tool lock files record
  # the SDK's implicit AOT packages, so the bump fails CI's locked restore until they are refreshed on its
  # branch (tools/README.md, ADR-0017, #645). backend/global.json is a feature-band floor and is not listed.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    ignore:
      # The SDK major moves with the rest of .NET in story 0056 (ADR-0050).
      - dependency-name: dotnet-sdk
        update-types: [version-update:semver-major]

  # Dockerfile base images and the postgres image pinned in compose.yaml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, backend]
    ignore:
      # Stay on PostgreSQL 18 (ADR-0014); a major upgrade is a deliberate decision.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      # The .NET 11 images arrive with the SDK and target framework in story 0056 (ADR-0050); an 11.0 SDK image
      # alone cannot build against the 10.0 SDK pin in backend/global.json.
      - dependency-name: dotnet/sdk
        update-types: [version-update:semver-major]
      - dependency-name: dotnet/aspnet
        update-types: [version-update:semver-major]

  # Repo tooling (.claude/skills/*, tools/) is not listed: Dependabot doesn't read .NET file-based
  # app #:package directives or folder-local Directory.Build.props, so those are bumped manually (ADR-0017).

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]
    groups:
      frontend-dev:
        dependency-type: development
        update-types: [minor, patch]
      frontend-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']
