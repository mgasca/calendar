[package]
name = "calendar-infrastructure"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
calendar-domain.workspace = true
chrono.workspace = true
diesel = { workspace = true, features = ["postgres_backend", "chrono", "uuid"] }
diesel-async = { workspace = true, features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations.workspace = true
futures-util.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
calendar-testing.workspace = true
rcgen.workspace = true
tempfile.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
uuid = { workspace = true, features = ["v4"] }
