name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes no Rust input skips the rust analysis (issue #882, ADR-0046 amendment of 2026-11-14).
  # The Rust input set is CI's Backend set: this job runs the same rules as CI's Changes job, then
  # .github/codeql-languages.jq. A push, the schedule and a dispatch analyse every language.
  languages:
    name: CodeQL languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Listing a pull request's files needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      exclude: ${{ steps.decide.outputs.exclude }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Decide which languages this run analyses
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          # The same input as CI's Changes job: each changed file and the old path of a rename, and whether the listing
          # holds as many files as the pull request changes.
          if [ "$EVENT" = pull_request ]; then
            listing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | [.filename, .previous_filename]')
            input=$(jq -sc --arg event "$EVENT" --argjson changed "$CHANGED_FILES" \
              '{event: $event, complete: (length == $changed), files: [.[][] | strings]}' <<< "$listing")
          else
            input=$(jq -nc --arg event "$EVENT" '{event: $event, complete: true, files: []}')
          fi
          changes=$(jq -c -f .github/ci-changes.jq <<< "$input")
          result=$(jq -c -f .github/codeql-languages.jq --argjson changes "$changes" <<< "$input")
          echo "exclude=$(jq -c .exclude <<< "$result")" >> "$GITHUB_OUTPUT"
          jq -r '"\(.files | length) changed file(s), listing complete: \(.complete)"' <<< "$input"
          jq -r '"rust: \(if .rust then "analysed" else "skipped, no Rust input changed" end)"' <<< "$result" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          # The repo tools (tools/, .claude/skills/) are .NET file-based apps with no project to build (ADR-0017).
          - csharp
          # The backend (backend/crates).
          - rust
          - javascript-typescript
          - actions
        exclude: ${{ fromJSON(needs.languages.outputs.exclude) }}
    steps:
      - uses: actions/checkout@v7
      # The Rust extractor loads the backend workspace with cargo: it fetches about 330 crates and builds their build
      # scripts and proc macros, 25-36 s of its LoadManifest phase on a cold runner (issue #883, record 0027). The rust
      # analysis restores the registry and a persistent target directory for the extractor, which cut that phase to
      # about 1 s. A run that is not a pull request saves both once per lock file, so pull requests read main's copies.
      # The target directory is also keyed on the runner's default rustc: the extractor reports "project Rust toolchain:
      # stable (default)", not the backend/ pin.
      - name: Read the extractor's Rust toolchain
        id: rustc
        if: matrix.language == 'rust'
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the cargo registry
        id: registry
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: codeql-rust-registry-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          # Only a pull request falls back to an older lock file's entry. A run that saves restores the exact key or
          # nothing, so a saved entry never carries crates or builds the lock file no longer uses.
          restore-keys: >-
            ${{ github.event_name == 'pull_request' && format('codeql-rust-registry-{0}-', runner.os) || '' }}
      - name: Restore the extractor's target directory
        id: target
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/codeql-rust-target
          key: >-
            codeql-rust-target-${{ runner.os }}-rustc-${{ steps.rustc.outputs.version }}-${{
            hashFiles('backend/Cargo.lock') }}
          restore-keys: >-
            ${{ github.event_name == 'pull_request'
            && format('codeql-rust-target-{0}-rustc-{1}-', runner.os, steps.rustc.outputs.version) || '' }}
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # No language here needs a build (ADR-0017, ADR-0051).
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-rust-target
        with:
          category: /language:${{ matrix.language }}
      - name: Report the extractor's cargo state
        if: always() && matrix.language == 'rust'
        env:
          TARGET: ${{ runner.temp }}/codeql-rust-target
        run: |
          echo "crates in the registry cache: $(find ~/.cargo/registry/cache -name '*.crate' 2>/dev/null | wc -l)"
          echo "build-script output dirs: $(find "$TARGET" -maxdepth 3 -type d -path '*/build/*' 2>/dev/null | wc -l)"
          echo "target directory: $(du -sh "$TARGET" 2>/dev/null | cut -f1)"
      - name: Save the cargo registry
        if: >-
          matrix.language == 'rust' && github.event_name != 'pull_request' && steps.registry.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.registry.outputs.cache-primary-key }}
      - name: Save the extractor's target directory
        if: matrix.language == 'rust' && github.event_name != 'pull_request' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/codeql-rust-target
          key: ${{ steps.target.outputs.cache-primary-key }}
