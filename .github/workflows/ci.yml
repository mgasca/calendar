name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet format --verify-no-changes --no-restore
      - name: EF Core model matches migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Calendar.Infrastructure --no-build --configuration Release
      # Tests start PostgreSQL through Testcontainers; ubuntu-latest runners include Docker (ADR-0016).
      - run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format cobertura --results-directory "$GITHUB_WORKSPACE/backend/TestResults"
      - name: OpenAPI contract is up to date
        run: |
          git diff --exit-code -- ../contracts || {
            echo "::error::contracts/openapi.json is stale. Run 'just contracts' and commit the result."
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-test-results
          path: backend/TestResults
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Verify ADR site at the root path
        run: pnpm --filter @calendar/docs verify:build
      - name: Verify ADR site at a project subpath
        run: |
          pnpm --filter @calendar/docs build
          pnpm --filter @calendar/docs verify:build
        env:
          DOCS_SITE_URL: https://example.org/calendar/
      - name: Read GitHub Pages configuration
        id: pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build and verify publication artifact
        if: steps.pages.outcome == 'success'
        run: |
          if [ -n "$PR_NUMBER" ]; then
            export DOCS_SITE_URL="${PAGES_URL%/}/pr-preview/pr-$PR_NUMBER/"
          else
            export DOCS_SITE_URL="$PAGES_URL"
          fi
          pnpm --filter @calendar/docs build
          pnpm --filter @calendar/docs verify:build
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Upload verified publication artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: adr-site
          path: frontend/apps/docs/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/**/coverage
          if-no-files-found: ignore

  tooling:
    name: Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # No repo-root global.json: tools target the latest .NET 10 SDK (ADR-0017).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Ensure shellcheck
        run: command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -yq shellcheck)
      - name: Read the pinned just version
        id: just-version
        run: echo "version=$(tr -d '[:space:]v' < .just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.just-version.outputs.version }}
      - name: Test and lint tooling
        run: just tooling
      - name: Azure role SQL matches the local init script (PostgreSQL in Docker)
        run: just infra-integration
      - name: Tooling package pins match backend
        run: just tool-versions
      - name: ADRs follow conventions
        run: just adr-check

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: smoke-password
          POSTGRES_DB: calendar
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /tmp/calendar-buildx-cache
          key: image-${{ runner.os }}-${{ github.sha }}
          restore-keys: image-${{ runner.os }}-
      - name: Build image with Buildx cache
        run: |
          docker buildx create --use
          docker buildx build --load --cache-from type=local,src=/tmp/calendar-buildx-cache --cache-to type=local,dest=/tmp/calendar-buildx-cache-new,mode=max \
            --build-arg NODE_VERSION="$(cat frontend/.node-version)" -t calendar:local .
          rm -rf /tmp/calendar-buildx-cache
          mv /tmp/calendar-buildx-cache-new /tmp/calendar-buildx-cache
      - name: Read the pinned just version
        id: just-version
        run: echo "version=$(tr -d '[:space:]v' < .just-version)" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.just-version.outputs.version }}
      - name: Run image and smoke test
        env:
          ConnectionStrings__Calendar: Host=127.0.0.1;Port=5432;Database=calendar;Username=postgres;Password=smoke-password
        run: |
          docker run -d --name calendar-smoke --network host -e ConnectionStrings__Calendar calendar:local
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/health >/dev/null; then break; fi
            sleep 1
          done
          just smoke-image
      - name: Container logs
        if: ${{ failure() }}
        run: docker logs calendar-smoke

  # Single stable check for branch protection, so adding/renaming jobs doesn't require ruleset changes.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [backend, frontend, tooling, image]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All CI jobs passed."
