[package]
name = "calendar-client-gen"
version = "0.1.0"
description = "Generates calendar-client's code from contracts/openapi.json with openapi-to-rust (ADR-0067)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "calendar-client-gen"
path = "src/main.rs"

[dependencies]
# Pinned exactly: a new version can change the generated code, so it moves in its own PR with the regenerated client.
openapi-to-rust = "=0.24.0"
serde_json = "1"

[lints]
workspace = true
