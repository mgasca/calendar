name: Dashboard snapshot

# Story 0053, ADR 0049, issue #596: daily, and on demand, this takes one snapshot of delivery data and commits it to the
# never-merged `dashboard-data` branch, one file per day (snapshots/YYYY-MM-DD.json). A second run on the same day
# replaces that day's file. It never runs for a pull request, so it fails no PR and is not part of `CI result`
# (ADR 0046). The logic, the schema and the privacy rules are in tools/delivery-dashboard.
#
# Three jobs keep write access away from the code that reads GitHub: `snapshot` can read runs and cannot write the
# repository or issues, `publish` can write the repository but runs only git commands on the file `snapshot` checked,
# and `alert` can write issues but not the repository.
on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DATA_BRANCH: dashboard-data

jobs:
  snapshot:
    name: Take and check the snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      # The agent proxies read issues, their comments and the pull requests that mention them (read only).
      issues: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    outputs:
      date: ${{ steps.take.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: tools/delivery-dashboard/packages.lock.json
      - name: Take the snapshot
        id: take
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +%F)
          mkdir -p "$RUNNER_TEMP/snapshot"
          dotnet run tools/delivery-dashboard/delivery-dashboard.cs -- snapshot \
            --repo "$GITHUB_REPOSITORY" --date "$date" --out "$RUNNER_TEMP/snapshot/$date.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - name: Check the snapshot again, as the file that will be published
        run: dotnet run tools/delivery-dashboard/delivery-dashboard.cs -- check "$RUNNER_TEMP/snapshot/${{ steps.take.outputs.date }}.json"
      # The size rule of the data branch (story 0053, issue #601): every daily snapshot is kept until the snapshots/ tree
      # would pass 50 MB (about 11 years at 12 KB a day, measured in docs/runbooks/delivery-dashboard.md); the run fails
      # before the snapshot that would pass it is published, and warns from 80 %. No data branch yet is fine; any other
      # git failure stops the job.
      - name: Check that the data branch stays within its size limit
        run: |
          file="$RUNNER_TEMP/snapshot/${{ steps.take.outputs.date }}.json"
          export GH_TOKEN="${{ github.token }}"
          status=0
          git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null || status=$?
          if [ "$status" -eq 2 ]; then
            echo "No $DATA_BRANCH branch yet: nothing to measure." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            echo "::error::Could not read the $DATA_BRANCH branch (git exit $status)."
            exit "$status"
          else
            # The trees API gives every blob's size without downloading a blob (a shallow fetch would download them all).
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$DATA_BRANCH?recursive=1" \
              | dotnet run tools/delivery-dashboard/delivery-dashboard.cs -- retention --add "$(wc -c < "$file")" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot/${{ steps.take.outputs.date }}.json
          if-no-files-found: error
          retention-days: 3

  # Thresholds on the flow and quality numbers (issue #601). It reuses the open `performance` issue of its kind or opens
  # it, as the CI trend check does (ADR 0045), and opens no other kind of alert. It needs issues: write and nothing else,
  # and runs only the checked-in tool on the snapshot `snapshot` already checked.
  alert:
    name: Open or update the threshold issues
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: tools/delivery-dashboard/packages.lock.json
      - uses: actions/download-artifact@v8
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot
      - name: Compare the snapshot with the thresholds
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ needs.snapshot.outputs.date }}
        run: |
          dotnet run tools/delivery-dashboard/delivery-dashboard.cs -- alerts \
            --snapshot "$RUNNER_TEMP/snapshot/$DATE.json" --repo "$GITHUB_REPOSITORY" --issue \
            --page-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/dashboard/" | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Commit the snapshot to the data branch
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The git credential is kept for the push. Nothing from this checkout is built or run: the data branch replaces it.
          persist-credentials: true
      - uses: actions/download-artifact@v8
        with:
          name: snapshot
          path: ${{ runner.temp }}/snapshot
      - name: Commit to the data branch
        env:
          DATE: ${{ needs.snapshot.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git fetch --depth 1 origin "$DATA_BRANCH"
            git switch -c "$DATA_BRANCH" FETCH_HEAD
          else
            git switch --orphan "$DATA_BRANCH"
            git rm -rfq --ignore-unmatch .
            printf '%s\n' \
              '# Dashboard data' '' \
              'One JSON snapshot per day in `snapshots/`, written by `.github/workflows/dashboard-snapshot.yml` on `main`.' \
              'This branch is never merged. See story 0053 and ADR-0049.' > README.md
          fi
          mkdir -p snapshots
          cp "$RUNNER_TEMP/snapshot/$DATE.json" "snapshots/$DATE.json"
          git add -A
          if git diff --cached --quiet; then
            echo "The snapshot for $DATE is unchanged."
            exit 0
          fi
          git commit -m "Snapshot $DATE"
          # A concurrent push moves the branch; rebase and try again, up to three times.
          for _ in 1 2 3; do
            if git push origin "$DATA_BRANCH"; then
              exit 0
            fi
            git pull --rebase origin "$DATA_BRANCH"
          done
          echo "Could not push the snapshot after three attempts." >&2
          exit 1
